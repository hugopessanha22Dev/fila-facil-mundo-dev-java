name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Run unit tests
        run: mvn -B test

      - name: Avaliacao offline da esteira de IA
        run: mvn -q exec:java@ai-delivery -Dexec.args=evaluate

      - name: Smoke ManifestCli (fixture valido)
        run: mvn -q exec:java@manifest-cli -Dexec.args=data/manifestos/valido.json

  artifact:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Package jar
        run: mvn -B package -DskipTests

      - name: Build distribution zip
        run: |
          mkdir -p dist/staging
          cp target/fila-facil-1.0.0.jar dist/staging/
          cp -r data/manifestos dist/staging/manifestos
          cp README.md dist/staging/
          (cd dist/staging && zip -r ../filafacil-manifest-validator.zip .)

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: filafacil-manifest-validator
          path: dist/filafacil-manifest-validator.zip

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: artifact
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: filafacil-manifest-validator
          path: dist

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/filafacil-manifest-validator.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
